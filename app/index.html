regras(c) {
const d = Math.max(0, c.dias ?? 30);
const ref = d <= 28 ? [45, 60] : d <= 60 ? [60, 90] : d <= 120 ? [75, 120] : d <= 180 ? [105, 150] : [120, 180];
const alvoJan = Math.round((ref[0] + ref[1]) / 2);
const p = [];
if (c.janela && c.janela > ref[1] + 10) p.push({ t: 'Comece a acalmar mais cedo', x: `Seu bebê fica acordado em média ${c.janela} min entre os sonos. Para a idade, a referência é de ${ref[0]} a ${ref[1]} min. Comece o ritual da soneca uns 15 minutos antes.`, a: { a: 'guia', v: 'sonecas', l: 'Guia Sonecas' } });
else if (c.janela && c.janela < ref[0] - 10) p.push({ t: 'Talvez ele vá dormir cedo demais', x: `A média acordado está em ${c.janela} min, abaixo da referência de ${ref[0]} a ${ref[1]} min. Se ele demora para pegar no sono, estique a janela em 10 a 15 minutos.` });
if (c.soneca && c.soneca < 40) p.push({ t: 'Sonecas curtas', x: `As sonecas duram em média ${c.soneca} min. Escureça o quarto, use ruído branco e tente acalmar antes de tirar do berço quando ele acordar cedo demais.`, a: { a: 'som', v: 'branco', l: 'Ruído branco' } });
if (c.picoExtra !== null && c.picoExtra >= 16 && c.picoExtra <= 22) p.push({ t: 'Antecipe o ritual nos dias difíceis', x: `O choro se concentra por volta das ${c.picoExtra}h. Comece o ritual 30 minutos mais cedo e diminua luz e visitas nesse horário.`, a: { a: 'sos', l: 'SOS do choro' } });
if (c.dormir && c.dormir > 21 * 60 + 30 && d > 60) p.push({ t: 'Traga a hora de dormir mais para cedo', x: `Ele tem ido dormir por volta das ${fromMin(c.dormir)}. Adiante 15 minutos a cada 3 dias, até perto das 20h30.` });
if (d <= 42) p.push({ t: 'Fase de adaptação', x: 'Nas primeiras semanas, blocos curtos de sono e o bebê mamando com frequência são esperados. Use o plano como referência, não como regra, e mantenha a livre demanda.' });
if (!p.length) p.push({ t: 'Continue assim', x: 'Os números estão dentro do esperado para a idade. Mantenha o ritual da noite e o ambiente escuro.' });
let hora = c.dormir ? Math.round(c.dormir / 15) * 15 : toMin(S.hora);
if (hora > 21 * 60 + 30 && d > 60) hora -= 15;
const acorda = c.acorda ? Math.round(c.acorda / 15) * 15 : 7 * 60;
const sonecaMin = Math.max(30, Math.min(120, c.soneca || (d <= 60 ? 45 : 60)));
const ag = [{ h: fromMin(acorda), t: 'Acordar, luz natural e amamentação' }];
let t = acorda, n = 1;
while (t + alvoJan + sonecaMin < hora - alvoJan && n < 7) { t += alvoJan; ag.push({ h: fromMin(t), t: `Soneca ${n} (cerca de ${sonecaMin} min)` }); t += sonecaMin; n++; }
ag.push({ h: fromMin(hora - 60), t: 'Banho e massagem do ritual' }, { h: fromMin(hora - 30), t: 'Luz baixa, pijama, amamentação e canção' }, { h: fromMin(hora), t: 'Berço, de barriga para cima' });
return { prioridades: p.slice(0, 3), agenda: ag, hora: fromMin(hora), nota: d <= 60 ? 'Horários aproximados. A amamentação continua em livre demanda.' : 'Horários aproximados. Ajuste aos sinais de sono do seu bebê.',
ref: `Referência para a idade: ${ref[0]} a ${ref[1]} min acordado entre os sonos.` };
},
},

`A primeira semana é sobre o básico dos primeiros dias em casa: amamentação, coto umbilical, banho, fraldas e sono seguro. Depois vêm o choro, o sono, a saúde do bebê e, na última semana, você.`,

{t:`A pega certa na amamentação`, f:`Uma boa pega evita dor e ajuda o bebê a mamar bem.`, a:[
`O Ministério da Saúde recomenda leite materno exclusivo até os 6 meses e junto com outros alimentos até 2 anos ou mais. Nos primeiros dias, o mais importante é a pega.`,
`## Sinais de uma boa pega`,
`- Boca bem aberta, como num bocejo`,`- Lábio de baixo virado para fora`,`- Queixo encostado no peito e nariz livre`,`- Aparece mais aréola acima da boca do que abaixo`,`- Bochechas redondas, sem covinhas`,`- Você ouve o bebê engolir`,
`## Se doer`,`Um incômodo no começo da amamentação pode acontecer, mas dor forte ou que continua não é normal. Coloque o dedo mínimo no canto da boca do bebê para soltar e tente de novo. Se a dor continuar, se surgirem rachaduras ou o peito ficar empedrado, procure ajuda: a unidade de saúde ou um Banco de Leite Humano.`,
`> Leite que sobra no fim da amamentação, passado na aréola, ajuda a proteger a pele do mamilo.`],
tar:[`Confira a pega na próxima amamentação com a lista acima`,`Registre a amamentação e o peito usado no Diário`]},
{t:`Fome, livre demanda e fraldas`, f:`O bebê mostra quando quer mamar, e as fraldas mostram se ele está mamando bem.`, a:[
`Recém-nascidos costumam mamar de 8 a 12 vezes em 24 horas, sem horário fixo. Isso se chama livre demanda.`,
`## Sinais de fome (antes do choro)`,`- Leva a mão à boca`,`- Vira a cabeça procurando o peito`,`- Estala os lábios, põe a língua para fora`,`- Fica mais agitado`,
`> O choro é um sinal tardio de fome. Ofereça o peito antes, nos primeiros sinais.`,
`## Como saber se está mamando bem`,`- A partir do 5º dia, 6 ou mais fraldas bem molhadas por dia`,`- Cocô amarelado depois da primeira semana`,`- Bebê ativo e satisfeito depois de mamar`,`- Ganho de peso conferido nas consultas`,
`Na dúvida sobre o ganho de peso, não espere: fale com o pediatra ou a unidade de saúde.`],
tar:[`Conte as fraldas molhadas de hoje no Diário`,`Observe e anote um sinal de fome do seu bebê`], m:{a:'tab',v:'diario',l:'Abrir o Diário'}},
{t:`Coto umbilical e banho`, f:`Cuidados simples e seguros.`, a:[
`O coto umbilical seca e cai sozinho, geralmente entre 1 e 2 semanas de vida.`,
`## Cuidando do coto`,`- Limpe a base com álcool 70% e um cotonete a cada troca de fralda, como orientado na maternidade`,`- Mantenha seco e dobre a fralda abaixo do coto`,`- Não puxe, não cubra com faixas nem use moedas ou pomadas caseiras`,
`> Procure atendimento se a pele ao redor ficar vermelha e inchada, se sair secreção com mau cheiro ou sangramento que não para.`,
`## O banho`,`- Água morna (teste com o cotovelo), ambiente sem vento, tudo separado antes`,`- Banho curto, de 5 a 10 minutos; pode dar banho mesmo antes do coto cair, secando bem depois`,`- Uma mão sempre segurando o bebê. Nunca o deixe sozinho na banheira, nem por um segundo`],
tar:[`Faça a limpeza do coto em cada troca de hoje`,`Separe tudo antes do próximo banho`]},
{t:`Trocas de fralda e assaduras`, f:`Pele limpa, seca e protegida.`, a:[
`- Troque sempre que estiver suja ou bem molhada`,`- Limpe com algodão e água morna, da frente para trás nas meninas`,`- Seque bem as dobrinhas antes de fechar a fralda nova`,`- Deixe a pele respirar um pouco, sem fralda, quando possível`,
`## Assaduras`,`Pele vermelha na área da fralda é comum. Trocas frequentes e pele seca resolvem a maioria. Uma pomada de barreira pode ajudar, com orientação do pediatra.`,
`> Evite talco e lenços com perfume nos primeiros meses. Procure o pediatra se aparecerem bolhas, feridas ou se a vermelhidão não melhorar em alguns dias.`],
tar:[`Organize um cantinho de troca com tudo à mão`,`Registre as fraldas de hoje`]},
{t:`Sono seguro`, f:`A regra mais importante para todo sono.`, a:[
`- Sempre de barriga para cima para dormir, inclusive nas sonecas`,`- Colchão firme e plano, com lençol bem preso`,`- Berço vazio: sem travesseiro, protetor, cobertor solto ou bichinhos`,`- De preferência no seu quarto, no berço dele, nos primeiros meses`,`- Não dormir com o bebê no sofá ou na poltrona`,`- Ambiente sem fumaça`,`- Roupa adequada à temperatura, sem excesso de agasalho`,
`> Posições de lado ou de bruços servem para acalmar no seu colo, acordado e com você atenta. Para dormir, sempre de barriga para cima.`],
tar:[`Revise o berço com a lista acima`], m:{a:'guia',v:'sonoseguro',l:'Abrir o guia Sono seguro'}},
{t:`Os testes e a primeira consulta`, f:`Exames rápidos que protegem a saúde do bebê.`, a:[
`Logo depois do nascimento, o bebê passa por testes de triagem. Confira na Caderneta da Criança quais já foram feitos.`,
`- Teste do pezinho: ideal entre o 3º e o 5º dia de vida`,`- Teste da orelhinha: audição, de preferência ainda no primeiro mês`,`- Teste do olhinho: reflexo vermelho dos olhos`,`- Teste do coraçãozinho: oxigenação, ainda na maternidade`,`- Teste da linguinha: avalia o frênulo da língua`,
`## A primeira consulta`,`O Ministério da Saúde recomenda a primeira consulta do bebê na primeira semana de vida. Leve a caderneta e as suas dúvidas anotadas.`,
`> Dica: anote as dúvidas no celular ao longo da semana. Na consulta, a gente esquece.`],
tar:[`Confira na caderneta quais testes já foram feitos`,`Marque na agenda o que já está feito`], m:{a:'agenda',l:'Abrir vacinas e consultas'}},
{t:`Por que o bebê chora`, f:`Choro é a primeira linguagem dele.`, a:[
`O choro é como o bebê avisa que precisa de algo: fome, desconforto, cansaço, calor, frio ou simplesmente colo. Colo não "acostuma mal": nos primeiros meses, é uma necessidade.`,
`É comum o choro aumentar nas primeiras semanas, ficar mais intenso por volta das 6 semanas e diminuir aos poucos entre o 3º e o 4º mês.`,
`## Investigue com calma`,`- Ele mamou há quanto tempo?`,`- A fralda está suja ou muito molhada?`,`- Está com calor ou frio? Toque a nuca, não as mãos`,`- Está acordado há muito tempo?`,`- Precisa arrotar?`],
tar:[`Leia o SOS do choro uma vez, com calma`,`Registre um choro no Diário e o que acalmou`], m:{a:'sos',l:'Abrir o SOS do choro'}},
{t:`Sinais de sono e janelas de sono`, f:`Agir cedo deixa tudo mais fácil.`, a:[
`Bebês cansados demais têm mais dificuldade para dormir. Por isso vale perceber os sinais de sono antes do choro.`,
`## Sinais precoces`,`- Olhar parado, bocejos`,`- Vira o rosto, perde o interesse`,`- Esfrega os olhos ou as orelhas`,
`## Quanto tempo ele aguenta acordado`,`- 0 a 4 semanas: cerca de 45 a 60 minutos`,`- 1 a 2 meses: cerca de 60 a 90 minutos`,`- 3 a 4 meses: cerca de 75 a 120 minutos`,
`> Use os números como referência e os sinais do seu bebê como guia.`],
tar:[`Observe e anote um sinal de sono do seu bebê`,`Registre o próximo sono no Diário`]},
{t:`Dia é dia, noite é noite`, f:`Ajude o relógio interno a se organizar.`, a:[
`Recém-nascidos ainda não sabem a diferença entre dia e noite. Você pode ajudar deixando os dois bem diferentes.`,
`## De dia`,`- Claridade, cortinas abertas`,`- Barulhos normais da casa`,`- Conversa e brincadeira quando ele estiver acordado`,
`## À noite`,`- Luz baixa e quente, voz baixa`,`- Troca de fralda só se necessário`,`- Nada de brincadeira ao amamentar de madrugada`,
`> Use o Modo Noite do app nas madrugadas: tela escura e botões grandes.`],
tar:[`Amamente à noite com luz baixa`], m:{a:'night',l:'Conhecer o Modo Noite'}},
{t:`O ritual da noite`, f:`Repetição traz segurança.`, a:[
`Uma sequência curta, feita na mesma ordem todas as noites, vira um sinal de que é hora de desacelerar.`,
`- Banho morno (opcional)`,`- Massagem com as mãos`,`- Fralda e pijama`,`- Amamentar com luz baixa`,`- Canção ou ruído branco`,`- Berço, de barriga para cima`,
`O seu ritual já está na rotina da aba Hoje, montado a partir do horário que você escolheu.`],
tar:[`Faça a massagem guiada do ritual`,`Repita o ritual por 3 noites`], m:{a:'guiado',v:'ritual',l:'Começar a massagem guiada'}},
{t:`Acolher: enrolar, embalar e o shhh`, f:`Técnicas para os momentos difíceis.`, a:[
`- Enrolar: braços junto ao corpo e quadril e pernas livres. Pare assim que o bebê mostrar sinais de que vai rolar`,`- Colo de lado ou de bruços, só para acalmar e com você atenta`,`- Shhh perto do ouvido, no volume do choro, baixando quando ele acalma`,`- Balanço pequeno e suave. Nunca sacuda o bebê`,`- Sucção: o peito ou a chupeta, se você usa`,
`> Combine duas ou três técnicas ao mesmo tempo e dê alguns minutos para funcionar.`],
tar:[`Use o som Shhh no próximo choro`], m:{a:'som',v:'shhh',l:'Tocar o Shhh'}},
{t:`Gases, arroto e cólica`, f:`Entender tira um pouco do peso.`, a:[
`Faça pausas para arrotar no meio e no fim da amamentação: no ombro, sentado no colo apoiando o queixo, ou de bruços sobre as suas pernas.`,
`## Cólica`,`É o choro intenso e difícil de acalmar, geralmente no fim da tarde, em um bebê saudável. Costuma começar entre a 2ª e a 3ª semana e melhorar até os 3 ou 4 meses. Não é culpa sua.`,
`- Massagem da barriguinha, uma vez por dia, longe da hora de mamar`,`- Bicicleta com as perninhas`,`- Colo de "tigre no galho", ruído branco e movimento`,
`> O pediatra deve avaliar para descartar outras causas, principalmente se houver febre, vômitos ou pouco ganho de peso.`],
tar:[`Teste duas posições de arroto`,`Faça a massagem da barriguinha`], m:{a:'guiado',v:'barriga',l:'Massagem da barriguinha'}},
{t:`Revisão da semana 2`, f:`O seu jeito, a sua casa.`, a:[
`Você aprendeu a ler o choro e o sono, montou o ritual da noite e conheceu formas de acolher.`,
`Ajuste o que não funcionou: talvez o banho fique melhor de manhã, talvez o seu bebê prefira a canção ao ruído. A rotina boa é a que funciona na sua casa.`,
`> Faça o check-in da semana: ele mostra a evolução mesmo nos dias cansativos.`],
tar:[`Faça o check-in da semana`], m:{a:'checkin',l:'Fazer o check-in'}},
{t:`Vacinas e consultas do primeiro ano`, f:`Uma agenda que o app monta para você.`, a:[
`O primeiro ano tem consultas de acompanhamento e várias vacinas. O Ministério da Saúde recomenda consultas na primeira semana e com 1, 2, 4, 6, 9 e 12 meses.`,
`As vacinas do calendário são gratuitas na unidade de saúde. Leve sempre a Caderneta da Criança.`,
`> A aba Cuidados mostra o que vem pela frente, pela idade do seu bebê. Marque cada item quando fizer.`,
`Depois da vacina é comum o bebê ficar mais sonolento ou irritado e ter febre baixa. Pergunte ao profissional o que fazer e quando voltar.`],
tar:[`Marque na agenda as vacinas e consultas já feitas`,`Anote a próxima data no seu calendário`], m:{a:'agenda',l:'Abrir vacinas e consultas'}},
{t:`Pele amarelinha, golfadas e outras dúvidas`, f:`O que é comum e o que pede atenção.`, a:[
`## Pele amarelada (icterícia)`,`É comum nos primeiros dias e costuma sumir sozinha. Procure atendimento se aparecer nas primeiras 24 horas, se o amarelo se espalhar para a barriga e as pernas, se o bebê ficar muito sonolento ou mamar mal, ou se o cocô ficar claro, esbranquiçado.`,
`> A Caderneta da Criança tem uma escala de cores do cocô. Use para comparar.`,
`## Golfadas`,`Devolver um pouco de leite depois de mamar é comum. Procure o pediatra se forem vômitos em jato, verdes ou com sangue, se o bebê não ganhar peso ou chorar muito ao mamar.`,
`## Soluço, espirro e barulhinhos ao respirar`,`Também são comuns nos primeiros meses e, sozinhos, não indicam doença.`],
tar:[`Confira a escala de cores do cocô na caderneta`]},
{t:`Febre: como medir e quando procurar`, f:`Saber o que fazer evita pânico.`, a:[
`- Meça com termômetro digital na axila, com o braço encostado no corpo`,`- Febre é 37,8 °C ou mais na axila`,`- Não dê remédio sem orientação do pediatra, nem a dose de outra criança`,
`> Bebê com menos de 3 meses com febre: procure atendimento logo, mesmo que ele pareça bem.`,
`Em qualquer idade, procure atendimento se houver dificuldade para respirar, moleza, recusa para mamar, manchas na pele ou choro muito diferente.`],
tar:[`Confira se há um termômetro digital em casa`,`Salve o telefone do pediatra e da unidade de saúde`], m:{a:'alerta',l:'Ver sinais de alerta'}},
{t:`Barriguinha para baixo e estímulos`, f:`Brincar também é cuidar.`, a:[
`Deixar o bebê de bruços, acordado e com você junto, fortalece pescoço e costas. Comece com 1 a 3 minutos, várias vezes ao dia. Vale de bruços sobre o seu peito.`,
`## Estímulos simples`,`- Converse, cante e narre o que você está fazendo`,`- Rosto a rosto, a uns 30 cm: é a distância que ele enxerga melhor`,`- Objetos de alto contraste, preto e branco`,`- Contato pele a pele`,
`> Nunca deixe o bebê de bruços dormindo ou sozinho.`],
tar:[`Faça 3 sessões curtas de barriguinha hoje`]},
{t:`Marcos do desenvolvimento`, f:`Cada bebê tem o seu ritmo.`, a:[
`Alguns marcos ajudam a acompanhar o desenvolvimento: o sorriso social costuma aparecer por volta dos 2 meses, sustentar a cabeça por volta dos 3 a 4, rolar entre 4 e 6, sentar sem apoio entre 6 e 9.`,
`> São médias. Pequenas diferenças são normais. Se algo preocupar você, converse com o pediatra: a sua percepção importa.`,
`Na aba Cuidados, em Primeiras vezes, você marca cada conquista com a data e guarda essa lembrança.`],
tar:[`Marque a primeira conquista do seu bebê`], m:{a:'conquistas',l:'Abrir Primeiras vezes'}},
{t:`Plano para a crise de choro`, f:`Ter um plano reduz o desespero.`, a:[
`- 1. Cheque o básico: fome, fralda, temperatura, arroto`,`- 2. Colo de "tigre no galho": bebê de bruços no seu antebraço`,`- 3. Shhh ou ruído branco`,`- 4. Movimento suave: andar, embalar`,`- 5. No seu limite: coloque o bebê no berço, em segurança, e saia do quarto por 5 minutos para respirar`,
`> Nunca sacuda o bebê. Se sentir que está perdendo o controle, chame alguém. Isso é cuidado, não fraqueza.`],
tar:[`Combine um revezamento com alguém de confiança`], m:{a:'sos',l:'Abrir o SOS do choro'}},
{t:`Revisão: o diário e a consulta`, f:`O diário lembra o que o cansaço esquece.`, a:[
`Olhe o Diário: amamentação, fraldas, sono, choro. O Resumo para o pediatra junta os números da semana num texto para mostrar na consulta.`,
`Anote também peso e comprimento a cada consulta em Crescimento.`],
tar:[`Abra o Resumo para o pediatra`,`Faça o check-in da semana`], m:{a:'resumo',l:'Abrir o resumo'}},
{t:`Seu corpo depois do parto`, f:`Você também está se recuperando.`, a:[
`- O sangramento depois do parto (lóquios) diminui aos poucos e pode durar algumas semanas`,`- Cuide da cicatriz ou dos pontos como orientado e mantenha a região limpa e seca`,`- Faça a consulta pós-parto: o Ministério da Saúde recomenda até 42 dias depois do parto`,
`> Procure atendimento se tiver febre, sangramento que encharca um absorvente em 1 hora, dor ou inchaço em uma perna, dor de cabeça forte, falta de ar, ou pus e vermelhidão na cicatriz.`],
tar:[`Marque a sua consulta pós-parto`]},
{t:`Baby blues ou algo mais?`, f:`Suas emoções também merecem cuidado.`, a:[
`Nos primeiros dias, é muito comum chorar fácil, ficar sensível e oscilar de humor. Isso se chama baby blues e costuma passar em até duas semanas.`,
`> Se a tristeza durar mais de duas semanas, se você perder o interesse pelas coisas, sentir culpa intensa, ansiedade que não passa ou pensamentos de se machucar ou de machucar o bebê, procure ajuda: seu médico, a unidade de saúde ou o CVV no 188 (gratuito, 24 horas).`,
`Pedir ajuda não é fracasso. É o que permite cuidar bem de vocês dois.`],
tar:[`Registre como você está hoje`,`Conte para alguém de confiança como tem se sentido`], m:{a:'mae',l:'Abrir Para você'}},
{t:`Cuidar de quem cuida`, f:`Pequenos cuidados que fazem diferença.`, a:[
`- Durma quando conseguir, pelo menos em uma soneca do bebê`,`- Deixe água e lanches fáceis perto de onde você amamenta`,`- Coma comida de verdade; aceite quando oferecerem comida pronta`,`- Saia um pouco ao ar livre`,`- Um minuto de respiração ajuda a baixar a tensão`],
tar:[`Faça a respiração guiada de 1 minuto`], m:{a:'resp',l:'Respirar por 1 minuto'}},
{t:`Dividir o cuidado`, f:`Ninguém precisa dar conta sozinha.`, a:[
`Pedir ajuda funciona melhor quando o pedido é concreto. "Me ajuda" é vago. "Você pode dar o banho hoje?" é claro.`,
`- Banho e ritual da noite`,`- Fazer arrotar depois de mamar`,`- Ficar com o bebê enquanto você dorme 1 hora`,`- Cuidar da casa ou da comida por um dia`],
tar:[`Peça uma ajuda concreta hoje`]},
{t:`Visitas e passeios`, f:`Carinho, sim. Com cuidado.`, a:[
`## Visitas`,`- Combine horários e visitas curtas nas primeiras semanas`,`- Todos lavam as mãos antes de pegar o bebê`,`- Quem estiver gripado ou doente fica para depois`,`- Evite beijos no rosto e nas mãos do bebê`,
`## Passeios`,`- Prefira horários com sol fraco e fique na sombra: bebês com menos de 6 meses não devem ficar no sol direto`,`- Leve fralda, roupa extra e água para você`,`- No carro, sempre no bebê-conforto, de costas para o movimento`],
tar:[`Combine com a família as regras de visita`]},
{t:`Rotina flexível e sonecas`, f:`Sequência importa mais que relógio.`, a:[
`Nos primeiros meses, rotina é uma sequência que se repete: mamar, ficar acordado um pouco, dormir. Os horários vão se ajustando conforme o bebê cresce.`,
`Sonecas curtas, de 30 a 45 minutos, são comuns. Quarto escuro e ruído branco ajudam; sonecas no colo ou no carrinho também valem.`],
tar:[`Observe a sequência de um dia inteiro no Diário`]},
{t:`Ordenha e volta ao trabalho`, f:`Planejar com antecedência deixa tudo mais leve.`, a:[
`- Lave bem as mãos; use um frasco de vidro com tampa de plástico, fervido por 15 minutos`,`- Leite ordenhado cru: até 12 horas na geladeira e até 15 dias no congelador ou freezer`,`- Descongele em banho-maria com o fogo desligado. Nunca no micro-ondas`,`- Ofereça em copinho, como orientado pelos Bancos de Leite`,
`> Comece a treinar a ordenha algumas semanas antes de voltar ao trabalho. Os Bancos de Leite Humano orientam de graça.`],
tar:[`Se for voltar ao trabalho, anote a data e comece a planejar`]},
{t:`Seu plano para os próximos meses`, f:`O que fica, o que muda.`, a:[
`Com o crescimento, as janelas de sono aumentam, os intervalos para mamar aumentam, vêm novas vacinas e, por volta dos 6 meses, os primeiros alimentos.`,
`O que continua valendo: ritual, sono seguro, agenda de saúde em dia e uma mãe cuidada.`,
`> A partir de agora, o Mês a mês acompanha vocês até o primeiro aniversário, liberado pela idade do bebê.`],
tar:[`Anote 3 coisas que funcionam com o seu bebê`]},
{t:`Você chegou ao dia 30`, f:`Olhe para trás: quanta coisa.`, a:[
`Trinta dias atrás você começou. De lá para cá aprendeu a pega, os cuidados do dia a dia, a ler o choro e o sono, cuidou da saúde do bebê e de você.`,
`Os dias difíceis vão continuar aparecendo, e agora você tem ferramentas para eles.`,
`> Continue usando o Diário, a agenda, os sons e o ritual. O app ${CONFIG.APP} segue com você.`],
tar:[`Faça o check-in final`,`Comemore. Você merece.`], m:{a:'checkin',l:'Fazer o check-in'}},
];

});
